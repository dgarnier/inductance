name: Release

on:
  # Wait for the test matrix rather than racing it.  Tests already runs on
  # every push to main, so keying off that run gates publishing on it without
  # defining the matrix twice or running it twice per push.
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Publish only when the matrix passed, and only for the run triggered by
    # the push itself: a manual Tests dispatch should not release anything.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    environment:
      name: release
    permissions:
      id-token: write
      pull-requests: write
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7 # v7.0.1
        with:
          fetch-depth: 2
          # A workflow_run job defaults to the tip of the default branch, which
          # may have moved on.  Use the commit that was actually tested.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Check if there is a parent commit
        id: check-parent-commit
        run: |
          echo "sha=$(git rev-parse --verify --quiet HEAD^)" >> "$GITHUB_OUTPUT"

      - name: Detect and tag new version
        id: check-version
        if: steps.check-parent-commit.outputs.sha
        uses: salsify/action-detect-and-tag-new-version@v2.0.3
        with:
          version-command: |
            uv run --only-dev bump-my-version show current_version

      - name: Bump version for developmental release
        if: ${{ ! steps.check-version.outputs.tag }}
        run: |
          uv run --only-dev bump-my-version bump patch

      - name: Build package
        run: |
          uv build

      - name: Publish package on PyPI
        if: steps.check-version.outputs.tag
        uses: pypa/gh-action-pypi-publish@v1.14.2

      - name: Publish package on TestPyPI
        if: ${{ ! steps.check-version.outputs.tag }}
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # The dev bump above always lands on the same next patch version, so
          # every merge that isn't a release builds a version TestPyPI may
          # already have.  Don't fail the run over it.
          skip-existing: true

      - name: Publish the release notes
        uses: release-drafter/release-drafter@v7
        with:
          publish: ${{ steps.check-version.outputs.tag != '' }}
          tag: ${{ steps.check-version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
